[package]
name = "diy-jev"
version = "0.1.0"
edition = "2024"
description = "Experimental Jev-compatible classification server powered by llama.cpp"
readme = "README.md"
license = "MIT"

[features]
default = ["cuda"]
cuda = ["llama-cpp-2/cuda"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.88"
clap = { version = "4.5", features = ["derive", "env"] }
axum = "0.8.8"
encoding_rs = "0.8.41"
hf-hub = "1.0.0"
llama-cpp-2 = "0.1.156"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
