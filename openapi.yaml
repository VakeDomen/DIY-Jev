openapi: 3.1.0
info:
  title: DIY Jev-compatible API
  version: 0.1.0
  description: |
    A local Jev-compatible structured evaluation API backed by llama.cpp.
    Questions are evaluated independently against the shared state.
    Probabilities are constrained softmax scores over the legal answer labels;
    they are not TypeSafe's proprietary calibrated probabilities.
servers:
  - url: http://localhost:8080
    description: Local server
paths:
  /:
    post:
      operationId: evaluate
      summary: Evaluate structured questions against shared state
      requestBody:
        $ref: '#/components/requestBodies/EvaluateRequest'
      responses:
        '200':
          $ref: '#/components/responses/EvaluateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/evaluate:
    post:
      operationId: evaluateV1
      summary: Evaluate structured questions against shared state
      requestBody:
        $ref: '#/components/requestBodies/EvaluateRequest'
      responses:
        '200':
          $ref: '#/components/responses/EvaluateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/systemone:
    post:
      operationId: evaluateSystemOne
      summary: Evaluate structured questions against shared state
      requestBody:
        $ref: '#/components/requestBodies/EvaluateRequest'
      responses:
        '200':
          $ref: '#/components/responses/EvaluateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /ai/run:
    post:
      operationId: cloudflareAiRun
      summary: Cloudflare AI-compatible evaluation route
      requestBody:
        $ref: '#/components/requestBodies/CloudflareEvaluateRequest'
      responses:
        '200':
          $ref: '#/components/responses/EvaluateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /model:
    get:
      operationId: getModel
      summary: Returns the identity of the currently loaded model
      responses:
        '200':
          $ref: '#/components/responses/ModelResponse'
  /health:
    get:
      operationId: health
      summary: Liveness check
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
  /ready:
    get:
      operationId: ready
      summary: Readiness check
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    EvaluateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EvaluateInput'
          example:
            state: "I ordered size 10 shoes but received size 8."
            questions:
              department:
                type: choice
                instructions: "Which department handles this?"
                criteria:
                  returns: "Returns and exchanges"
                  shipping: "Delivery issues"
                  billing: "Charges and refunds"
              refund:
                type: noul
                instructions: "Is the customer asking for a refund?"
              severity:
                type: score
                instructions: "How severe is the problem?"
                criteria:
                  - Minor
                  - "Moderate: wrong item"
                  - "Major: safety or financial loss"
    CloudflareEvaluateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CloudflareEvaluateInput'
          example:
            model: typesafe/jev
            input:
              state: "I ordered size 10 shoes but received size 8."
              questions:
                department:
                  type: choice
                  instructions: "Which department handles this?"
                  criteria:
                    returns: "Returns and exchanges"
                    shipping: "Delivery issues"
                    billing: "Charges and refunds"
                refund:
                  type: noul
                  instructions: "Is the customer asking for a refund?"
                severity:
                  type: score
                  instructions: "How severe is the problem?"
                  criteria:
                    - Minor
                    - "Moderate: wrong item"
                    - "Major: safety or financial loss"
  responses:
    EvaluateResponse:
      description: Structured answers and token usage.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EvaluateResponse'
          example:
            model: "diy-jev-0.1.0"
            answers:
              department:
                type: choice
                choice: returns
                confidence: 0.85
                probabilities:
                  returns: 0.85
                  shipping: 0.10
                  billing: 0.05
              refund:
                type: noul
                noul: 0.92
              severity:
                type: score
                score: 1.7
                confidence: 0.65
                legend:
                  "0": Minor
                  "1": "Moderate: wrong item"
                  "2": "Major: safety or financial loss"
                probabilities:
                  "0": 0.10
                  "1": 0.25
                  "2": 0.65
            usage:
              input_tokens: 128
              output_tokens: 3
    BadRequest:
      description: Invalid JSON or malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ContentTooLarge:
      description: Request body exceeds the 2 MB limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMedia:
      description: Request must use application/json content-type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Request is valid JSON but fails semantic validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: The inference backend returned an error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: The inference worker is unavailable or queue is full.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ModelResponse:
      description: The identity of the currently loaded model.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ModelIdentity'
    HealthResponse:
      description: Server is live and the model has loaded.
      content:
        text/plain:
          schema:
            type: string
            example: ok
  schemas:
    EvaluateInput:
      type: object
      required: [state, questions]
      additionalProperties: true
      properties:
        model:
          description: Optional model identifier. If provided, must match the running model (prefixed with `systemone/`).
          oneOf:
            - type: string
              example: systemone/diy-jev-0.1.0
            - type: 'null'
        state:
          description: Shared state evaluated by every question.
          type: [string, number, boolean, object, array, 'null']
        questions:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/Question'
    CloudflareEvaluateInput:
      type: object
      required: [input]
      additionalProperties: true
      properties:
        model:
          oneOf:
            - type: string
              example: typesafe/jev
            - type: 'null'
        input:
          $ref: '#/components/schemas/EvaluateInput'
    Question:
      discriminator:
        propertyName: type
        mapping:
          noul: '#/components/schemas/NoulQuestion'
          choice: '#/components/schemas/ChoiceQuestion'
          score: '#/components/schemas/ScoreQuestion'
      oneOf:
        - $ref: '#/components/schemas/NoulQuestion'
        - $ref: '#/components/schemas/ChoiceQuestion'
        - $ref: '#/components/schemas/ScoreQuestion'
    NoulQuestion:
      type: object
      required: [type, instructions]
      additionalProperties: true
      properties:
        type:
          const: noul
        instructions:
          description: |
            Prompt instruction. May be a string, an object (rendered as JSON),
            or an array (rendered as a bullet list).
          oneOf:
            - type: string
              minLength: 1
            - type: object
            - type: array
              items: {}
        criteria:
          type: object
          required: ['true', 'false']
          minProperties: 2
          maxProperties: 2
          additionalProperties: true
          properties:
            'true':
              type: ["string", "null"]
            'false':
              type: ["string", "null"]
    ChoiceQuestion:
      type: object
      required: [type, instructions, criteria]
      additionalProperties: true
      properties:
        type:
          const: choice
        instructions:
          description: |
            Prompt instruction. May be a string, an object (rendered as JSON),
            or an array (rendered as a bullet list).
          oneOf:
            - type: string
              minLength: 1
            - type: object
            - type: array
              items: {}
        criteria:
          type: object
          minProperties: 2
          maxProperties: 255
          additionalProperties:
            type: ["string", "null"]
    ScoreQuestion:
      type: object
      required: [type, instructions, criteria]
      additionalProperties: true
      properties:
        type:
          const: score
        instructions:
          description: |
            Prompt instruction. May be a string, an object (rendered as JSON),
            or an array (rendered as a bullet list).
          oneOf:
            - type: string
              minLength: 1
            - type: object
            - type: array
              items: {}
        criteria:
          type: array
          minItems: 2
          maxItems: 10
          items:
            type: string
    EvaluateResponse:
      type: object
      required: [model, answers, usage]
      additionalProperties: true
      properties:
        model:
          type: string
          example: diy-jev-0.1.0
        answers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Answer'
        usage:
          $ref: '#/components/schemas/Usage'
    Answer:
      discriminator:
        propertyName: type
        mapping:
          noul: '#/components/schemas/NoulAnswer'
          choice: '#/components/schemas/ChoiceAnswer'
          score: '#/components/schemas/ScoreAnswer'
      oneOf:
        - $ref: '#/components/schemas/NoulAnswer'
        - $ref: '#/components/schemas/ChoiceAnswer'
        - $ref: '#/components/schemas/ScoreAnswer'
    NoulAnswer:
      type: object
      required: [type, noul]
      additionalProperties: true
      properties:
        type:
          const: noul
        noul:
          type: number
          minimum: 0
          maximum: 1
    ChoiceAnswer:
      type: object
      required: [type, choice, confidence, probabilities]
      additionalProperties: true
      properties:
        type:
          const: choice
        choice:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        probabilities:
          type: object
          minProperties: 2
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
    ScoreAnswer:
      type: object
      required: [type, score, confidence, legend, probabilities]
      additionalProperties: true
      properties:
        type:
          const: score
        score:
          type: number
          minimum: 0
        confidence:
          type: number
          minimum: 0
          maximum: 1
        legend:
          type: object
          minProperties: 2
          additionalProperties:
            type: string
        probabilities:
          type: object
          minProperties: 2
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
    Usage:
      type: object
      required: [input_tokens, output_tokens]
      additionalProperties: true
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
    ModelIdentity:
      type: object
      required: [model]
      properties:
        model:
          type: string
          example: systemone/diy-jev-0.1.0
    Error:
      type: object
      required: [error]
      additionalProperties: true
      properties:
        error:
          type: string
