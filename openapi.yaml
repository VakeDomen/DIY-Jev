openapi: 3.1.0
info:
  title: Granite Jev-compatible API
  version: 0.1.0
  description: |
    A local Jev-compatible structured evaluation API backed by Granite and
    llama.cpp. Questions are evaluated independently against the shared state.
    Probabilities are constrained softmax scores over the legal answer labels;
    they are not TypeSafe's proprietary calibrated probabilities.
servers:
  - url: http://127.0.0.1:8080
    description: Local server (default)
paths:
  /:
    post:
      operationId: evaluate
      summary: Evaluate structured questions against shared state
      requestBody:
        $ref: '#/components/requestBodies/EvaluateRequest'
      responses:
        '200':
          $ref: '#/components/responses/EvaluateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/evaluate:
    post:
      operationId: evaluateV1
      summary: Evaluate structured questions against shared state
      requestBody:
        $ref: '#/components/requestBodies/EvaluateRequest'
      responses:
        '200':
          $ref: '#/components/responses/EvaluateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /ai/run:
    post:
      operationId: cloudflareAiRun
      summary: Cloudflare AI-compatible evaluation route
      requestBody:
        $ref: '#/components/requestBodies/EvaluateRequest'
      responses:
        '200':
          $ref: '#/components/responses/EvaluateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health:
    get:
      operationId: health
      summary: Liveness check
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
  /ready:
    get:
      operationId: ready
      summary: Readiness check
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
components:
  requestBodies:
    EvaluateRequest:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/EvaluateInput'
              - $ref: '#/components/schemas/CloudflareEvaluateInput'
          examples:
            direct:
              value:
                state: I ordered size 10 shoes but received size 8.
                questions:
                  department:
                    type: choice
                    instructions: Which department handles this?
                    criteria:
                      returns: Returns and exchanges
                      shipping: Delivery issues
                      billing: Charges and refunds
                  refund:
                    type: noul
                    instructions: Is the customer asking for a refund?
            cloudflare:
              value:
                model: typesafe/jev
                input:
                  state: I ordered size 10 shoes but received size 8.
                  questions:
                    refund:
                      type: noul
                      instructions: Is the customer asking for a refund?
  responses:
    EvaluateResponse:
      description: Structured answers and token usage.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EvaluateResponse'
    BadRequest:
      description: Invalid JSON, question schema, or inference input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: The inference worker is unavailable or stopped.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    HealthResponse:
      description: Server is live and the model has loaded.
      content:
        text/plain:
          schema:
            type: string
            example: ok
  schemas:
    EvaluateInput:
      type: object
      required: [state, questions]
      additionalProperties: false
      properties:
        state:
          description: Shared state evaluated by every question.
          type: [string, number, boolean, object, array, 'null']
        questions:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/Question'
    CloudflareEvaluateInput:
      type: object
      required: [model, input]
      additionalProperties: false
      properties:
        model:
          type: string
          minLength: 1
          example: typesafe/jev
        input:
          $ref: '#/components/schemas/EvaluateInput'
    Question:
      discriminator:
        propertyName: type
      oneOf:
        - $ref: '#/components/schemas/NoulQuestion'
        - $ref: '#/components/schemas/ChoiceQuestion'
        - $ref: '#/components/schemas/ScoreQuestion'
    NoulQuestion:
      type: object
      required: [type, instructions]
      additionalProperties: false
      properties:
        type:
          const: noul
        instructions:
          type: string
          minLength: 1
        criteria:
          type: object
          required: ['true', 'false']
          minProperties: 2
          maxProperties: 2
          additionalProperties: false
          properties:
            'true':
              type: string
            'false':
              type: string
    ChoiceQuestion:
      type: object
      required: [type, instructions, criteria]
      additionalProperties: false
      properties:
        type:
          const: choice
        instructions:
          type: string
          minLength: 1
        criteria:
          type: object
          minProperties: 2
          maxProperties: 26
          additionalProperties:
            type: string
    ScoreQuestion:
      type: object
      required: [type, instructions, criteria]
      additionalProperties: false
      properties:
        type:
          const: score
        instructions:
          type: string
          minLength: 1
        criteria:
          type: array
          minItems: 2
          maxItems: 26
          items:
            type: string
    EvaluateResponse:
      type: object
      required: [model, answers, usage]
      additionalProperties: false
      properties:
        model:
          type: string
          example: granite-jev-0.1.0
        answers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Answer'
        usage:
          $ref: '#/components/schemas/Usage'
    Answer:
      discriminator:
        propertyName: type
      oneOf:
        - $ref: '#/components/schemas/NoulAnswer'
        - $ref: '#/components/schemas/ChoiceAnswer'
        - $ref: '#/components/schemas/ScoreAnswer'
    NoulAnswer:
      type: object
      required: [type, noul]
      additionalProperties: false
      properties:
        type:
          const: noul
        noul:
          type: number
          minimum: 0
          maximum: 1
    ChoiceAnswer:
      type: object
      required: [type, choice, confidence, probabilities]
      additionalProperties: false
      properties:
        type:
          const: choice
        choice:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        probabilities:
          type: object
          minProperties: 2
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
    ScoreAnswer:
      type: object
      required: [type, score, confidence, legend, probabilities]
      additionalProperties: false
      properties:
        type:
          const: score
        score:
          type: number
          minimum: 0
        confidence:
          type: number
          minimum: 0
          maximum: 1
        legend:
          type: object
          minProperties: 2
          additionalProperties:
            type: string
        probabilities:
          type: object
          minProperties: 2
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
    Usage:
      type: object
      required: [input_tokens, output_tokens]
      additionalProperties: false
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
