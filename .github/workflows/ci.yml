name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked --no-default-features --lib --test integration_test
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/contract_test.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
